<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6eb">
  <meta name="description" content="예주니와 함니가 걷는 작은 섬. 해변에서 조개를 줍고 나무 부두에서 낚시해요.">
  <title>깜돌의 섬 산책</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #253d35;
      background: #f8f6eb;
      font-synthesis: none;
      --ink: #253d35;
      --muted: #53695f;
      --paper: #fffdf3;
      --line: #dedfd1;
      --pine: #2d5e50;
      --peach: #ffc886;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; color: inherit; }
    button:focus-visible, canvas:focus-visible { outline: 3px solid #ed9466; outline-offset: 3px; }
    button:disabled { opacity: .62; cursor: default; }
    button:not(:disabled) { cursor: pointer; }
    [hidden] { display: none !important; }
    svg { display: block; width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .symbols { position: absolute; height: 0; overflow: hidden; }
    .game { width: min(100% - 64px, 1352px); margin: 0 auto; padding: 23px 0 19px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    .titlebox, .tools, .tool, .where, .pair, .avatar-group, .key-tip, .main-action, .zone { display: flex; align-items: center; }
    .titlebox { gap: 13px; min-width: 0; }
    .brand { width: 47px; height: 47px; flex: 0 0 47px; display: grid; place-items: center; background: #deebe1; color: var(--pine); border: 1px solid #cdded0; border-radius: 16px; }
    .brand svg { width: 31px; height: 31px; stroke-width: 1.4; }
    .subtitle { margin: 0 0 3px; font-family: Georgia, serif; font-size: 11px; font-weight: 700; letter-spacing: .15em; color: #537064; }
    h1 { margin: 0; font-size: clamp(21px, 3.3vw, 31px); letter-spacing: -.075em; line-height: 1.18; }
    .tools { gap: 8px; }
    .tool { min-height: 42px; justify-content: center; gap: 7px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 14px; font-weight: 700; white-space: nowrap; }
    .tool:hover, .tool[aria-pressed="true"] { background: #e5efe3; border-color: #c5d9cd; }
    .tool svg { width: 19px; height: 19px; }
    .scene { position: relative; overflow: hidden; isolation: isolate; border-radius: 24px; background: #7cc9c5; border: 1px solid #a9c9b4; box-shadow: 0 5px 0 #e4e7d7; }
    canvas#island { width: 100%; height: clamp(400px, calc(100svh - 224px), 840px); touch-action: none; display: block; }
    .scene-header { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; pointer-events: none; }
    .where, .zone { gap: 6px; border: 1px solid #fff8e6; background: #fff9eaf5; box-shadow: 0 2px 7px #36544924; border-radius: 100px; color: #3b5548; font-weight: 750; font-size: 13px; padding: 7px 11px; white-space: nowrap; }
    .where svg, .zone svg { width: 17px; height: 17px; }
    .map { width: 138px; margin: 0; padding: 5px 5px 4px; background: #fffaebf2; border: 1px solid #fffaef; border-radius: 16px; box-shadow: 0 2px 7px #36544924; }
    #map { display: block; width: 126px; height: 66px; border-radius: 11px; }
    .map figcaption { margin: 4px 0 2px; text-align: center; font-size: 11px; font-weight: 700; color: #49645a; }
    .scene-message { position: absolute; z-index: 3; bottom: 17px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 36px); display: flex; align-items: center; gap: 9px; border: 1px solid #fff5dc; box-shadow: 0 3px 13px #304c4733; padding: 9px 14px; border-radius: 14px; color: #415849; background: #fff9eaf5; pointer-events: none; font-size: 14px; line-height: 1.45; }
    .scene-message svg { color: #7c6b36; flex: 0 0 19px; width: 19px; height: 19px; }
    .scene-message[data-alert="true"] { background: #ffdb9b; border-color: #fff2cf; color: #573d15; font-weight: 800; }
    .scene-message strong { color: #305345; white-space: nowrap; }
    .message-line { display: block; }
    .message-line + .message-line { margin-top: 4px; }
    .pad { display: none; position: absolute; z-index: 4; bottom: 13px; left: 12px; grid-template: repeat(2, 42px) / repeat(3, 42px); gap: 4px; touch-action: none; }
    .pad button { display: grid; place-items: center; border: 1px solid #fff4da; background: #fff9eae8; box-shadow: 0 2px 3px #38574733; border-radius: 11px; font-size: 18px; touch-action: none; }
    .pad button:active { background: #f6cd8f; }
    .pad .up { grid-column: 2; }
    .pad .left { grid-row: 2; grid-column: 1; }
    .pad .down { grid-row: 2; grid-column: 2; }
    .pad .right { grid-row: 2; grid-column: 3; }
    .control-tray { display: grid; grid-template-columns: minmax(215px,1fr) auto minmax(190px,1fr); align-items: center; gap: 18px; padding: 15px 14px 0; }
    .pair { gap: 10px; }
    .avatar-group { gap: 2px; }
    .avatar { width: 36px; height: 36px; background: #e6eddf; border-radius: 13px; border: 1px solid #d9e2d3; }
    .avatar:last-child { background: #f6edcc; border-color: #eadfbd; }
    .pair strong { display: block; font-size: 14px; line-height: 1.35; letter-spacing: -.025em; }
    .pair small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .key-tip { color: var(--muted); gap: 7px; font-size: 13px; white-space: nowrap; }
    kbd { display: inline-grid; min-width: 24px; height: 24px; padding: 0 4px; place-items: center; border: 1px solid #d6dbca; border-bottom-width: 2px; border-radius: 5px; background: #fffdf4; color: #4f675a; font: inherit; font-weight: 700; font-size: 12px; line-height: 1; }
    .key-group { display: flex; gap: 2px; }
    .key-group kbd { font-size: 13px; }
    .touch-hint { display: none; }
    .main-action { justify-content: center; justify-self: end; gap: 8px; padding: 0 11px 0 14px; min-height: 44px; min-width: 169px; border-radius: 12px; border: 1px solid #315d50; background: var(--pine); color: #fff9e8; box-shadow: 0 2px 0 #20433a; font-size: 15px; font-weight: 750; }
    .main-action:hover { background: #37745f; }
    .main-action[data-alert="true"] { color: #493917; background: var(--peach); border-color: #bb8450; box-shadow: 0 2px 0 #956b4e; }
    .main-action svg { width: 20px; height: 20px; }
    .main-action kbd { margin-left: auto; background: #ffffff20; color: inherit; border-color: #ffffff47; }
    dialog { width: min(510px, calc(100% - 24px)); max-height: min(91svh, 690px); border: 1px solid #dfd8bf; background: var(--paper); color: var(--ink); border-radius: 22px; padding: 23px; box-shadow: 0 16px 55px #233e3755; }
    dialog::backdrop { background: #28493c79; backdrop-filter: blur(3px); }
    .journal-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
    .journal-head h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.06em; }
    .journal-head p { margin: 0 0 15px; color: var(--muted); font-size: 14px; }
    .close { display: grid; place-items: center; width: 37px; height: 37px; border: 1px solid var(--line); border-radius: 10px; background: #f3f1e3; }
    .journal-group { margin-top: 15px; }
    .journal-group h3 { margin: 0 0 8px; font-size: 15px; }
    .journal-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; margin: 0; padding: 0; list-style: none; }
    .journal-row li { min-width: 0; display: flex; gap: 6px; align-items: center; padding: 7px; background: #e9eee0; border-radius: 9px; font-size: 13px; min-height: 37px; }
    .journal-row li.unseen { background: #f3f0e5; color: #666b5c; }
    .journal-row li svg { flex: 0 0 17px; width: 17px; height: 17px; }
    .journal-row li b { margin-left: auto; font-size: 12px; }
    @media (max-width: 760px) {
      .game { width: calc(100% - 24px); padding-top: 12px; }
      .scene { border-radius: 17px; }
      .control-tray { padding: 13px 1px 0; gap: 8px; grid-template-columns: 1fr auto; }
      .key-tip { display: none; }
      .scene-header { left: 10px; right: 10px; top: 10px; }
    }
    @media (pointer: coarse) {
      .pad { display: grid; }
      .scene-message { bottom: 111px; }
      .key-tip kbd, .main-action kbd { display: none; }
      .desktop-hint { display: none; }
      .touch-hint { display: inline; }
    }
    @media (max-width: 480px) {
      .masthead { margin-bottom: 11px; gap: 5px; }
      .titlebox { gap: 7px; }
      .brand { width: 37px; height: 37px; flex-basis: 37px; border-radius: 12px; }
      .brand svg { width: 26px; height: 26px; }
      .subtitle { font-size: 9px; }
      .tools { gap: 4px; }
      .tool { min-height: 36px; min-width: 36px; padding: 0 7px; font-size: 12px; gap: 3px; }
      .tool svg { width: 17px; height: 17px; }
      #sound span { display: none; }
      canvas#island { height: max(415px, calc(100svh - 156px)); }
      .map { width: 101px; }
      #map { width: 89px; height: 46px; }
      .pair { gap: 5px; }
      .avatar { width: 29px; height: 29px; border-radius: 9px; }
      .pair strong { font-size: 13px; }
      .pair small { font-size: 11px; }
      .main-action { gap: 5px; min-width: 0; padding: 0 9px; font-size: 13px; }
      .main-action kbd { min-width: 19px; height: 20px; }
      .scene-message { padding: 7px 9px; font-size: 12px; max-width: calc(100% - 20px); }
      .journal-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-island" viewBox="0 0 32 32"><path d="M3 23c3.5 0 3.5-2 6.5-2s3 2 6.5 2 3.5-2 6.5-2 3 2 6.5 2M6 28c2.5-.2 3-1.7 5.5-1.7s3.2 1.7 5.5 1.7 3-1.7 5.5-1.7 3.2 1.7 5 1.7M8 18l5.5-7 3.5 4 3.5-3.5 4 6.5"/><circle cx="22.7" cy="7" r="2.6" fill="#f0ae6c" stroke="none"/></symbol>

    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8a6 6 0 0 1 0 8m2-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zm12 1 4 4m0-4-4 4"/></symbol>

  </svg>
  <main class="game">
    <header class="masthead">
      <div class="titlebox">
        <div class="brand" aria-hidden="true"><svg><use href="#i-island"></use></svg></div>
        <div><p class="subtitle" lang="en">LITTLE TIDE ISLAND</p><h1>깜돌의 섬 산책</h1></div>
      </div>
      <div class="tools">
        <button class="tool" id="sound" type="button" aria-label="파도 소리 켜기" aria-pressed="false"><svg aria-hidden="true"><use href="#i-muted"></use></svg><span>파도 소리</span></button>

      </div>
    </header>
    <section class="scene" aria-label="섬 산책 게임 화면">
      <canvas id="island" tabindex="0" aria-label="방향키나 WASD로 걷거나 화면을 눌러 이동하세요. E 또는 스페이스바로 행동합니다.">이 게임을 플레이하려면 캔버스를 지원하는 브라우저가 필요해요.</canvas>
      <div class="scene-header">
        <div class="where"><svg aria-hidden="true"><use href="#i-pin"></use></svg><span id="where">해바라기 길</span></div>
        <figure class="map"><canvas id="map" width="252" height="132" aria-hidden="true"></canvas><figcaption>섬 지도</figcaption></figure>
      </div>

      <div class="pad" aria-label="이동 조작">

        <button type="button" class="right" data-dir="d" aria-label="오른쪽으로">→</button>
      </div>

  </main>

  <script>
  "use strict";
  const el = id => document.getElementById(id);
  const canvas = el("island");
  const ctx = canvas.getContext("2d");
  const mapCtx = el("map").getContext("2d");
  const W = 1320;
  const H = 690;
  const TAU = Math.PI * 2;
  const coast = "M-28,-24 H562 C575,16 597,59 610,95 C634,155 674,182 728,224 C776,259 801,304 794,355 C787,407 822,450 838,477 C866,520 817,562 784,590 C754,616 699,632 681,671 L671,720 H-28 Z";

  const land = new Path2D(coast);

  const walkableSand = new Path2D("M-20,-20 H552 C557,27 579,62 597,104 C625,169 671,197 722,234 C762,263 788,310 780,356 C775,411 808,456 825,485 C845,515 801,558 773,581 C736,610 686,620 666,666 L653,716 H-20 Z");

  const canMove = element => element instanceof HTMLElement && /^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(element.tagName);

  const p = {x: 461, y: 399, moving: false, facing: 1, phase: 0};
  const h = {x: 403, y: 423, moving: false, facing: 1, phase: 0};
  const outfits = {
    yejun: {name: "예주니", skin: "#ffe4cf", shade: "#eabda8", blush: "#edab9f", hair: "#263757", light: "#4c6382", top: "#749fc0", topDark: "#456c92", collar: "#e9f3ec", pants: "#e6dbb6", shoe: "#39485b"},

  const fish = [
    {id:"goby", name:"망둑어", color:"#ad805d"},
    {id:"mackerel", name:"고등어", color:"#6396aa"},
    {id:"bream", name:"도미", color:"#dc867c"},
    {id:"puffer", name:"복어", color:"#ecb665"},

  const shellTypes = [
    {id:"pink", name:"분홍 조개", color:"#eea99f"},
    {id:"ivory", name:"상아빛 조개", color:"#fff0ca"},
    {id:"violet", name:"보랏빛 조개", color:"#baa4c6"}
  ];
  const shells = [
    {...shellTypes[0], x:737,y:554},
    {...shellTypes[1], x:688,y:624},

  const decor = [

    ["oak",477,141,1.16],["pine",544,195,1.14],["oak",656,270,1.05],["pine",611,211,.78],

  const obstacles = [
    ...decor.map(([,x,y,s])=>({x,y:y-5,rx:21*s,ry:15*s})),
    {x:343,y:216,rx:112,ry:45},{x:343,y:258,rx:83,ry:23},
    {x:612,y:556,rx:48,ry:13},{x:674,y:503,rx:18,ry:12},{x:226,y:479,rx:14,ry:8}

  const dock = {x:758,y:378,w:290,h:80,endX:1000,endY:350,endW:122,endH:136};
  const places = {walk:"해바라기 길",cottage:"바람집 앞뜰",beach:"물결 해변",dock:"나무 부두"};
  const storageKey = "little-tide-island-v1";
  let counts = {};
  try {
    const data = JSON.parse(localStorage.getItem(storageKey));
    for (const item of [...fish, ...shellTypes]) {
      if (Number.isSafeInteger(data?.[item.id]) && data[item.id] > 0) counts[item.id] = data[item.id];
    }
  } catch {}

  let route = [];
  let clickMark = null;
  let messageUntil = 0;
  let moveKeys = new Set();
  let padKeys = new Map();
  let visitedPlace = "walk";
  let dialogueIndex = 0;
  let currentAction = "";

  function walkable(x,y) {

  function findRoute(from,x,y) {

      if(!spot) {h.moving=false; return;}
      if(Math.hypot(spot.x-h.x,spot.y-h.y)<4) {h.moving=false; return;}

    const next=reachable.find(point=>lineWalkable(h,point));
    if(next) {

    if(!reachable.length&&gap<63) {h.moving=false; companionRoute=[]; return;}
    if(now>companionCooldown) {

    showMessage([[outfits.yejun.name,yejun],[outfits.hamni.name,hamni]],symbol,6800);
  }
  function save() {
    try { localStorage.setItem(storageKey,JSON.stringify(counts)); } catch {}
    updateJournal();
  }
  function updateJournal() {
    for(const [id,items,symbol] of [["fish-list",fish,"fish"],["shell-list",shellTypes,"shell"]]) {
      const rows=items.map(item=>{
        const row=document.createElement("li"), span=document.createElement("span");
        span.textContent=counts[item.id]?item.name:"아직 못 만남";
        row.classList.toggle("unseen",!counts[item.id]);
        row.append(icon(symbol),span);
        if(counts[item.id]) {
          row.querySelector("svg").style.color=item.color;
          const b=document.createElement("b"); b.textContent="×"+counts[item.id]; row.append(b);
        }
        return row;
      });
      el(id).replaceChildren(...rows);
    }
    el("total").textContent=Object.keys(counts).length+"/"+(fish.length+shellTypes.length);
  }
  updateJournal();

  function place() {
    if(p.x>=777&&nearDock(p.x,p.y)) return "dock";
    if((p.y>=554&&p.x>=560)||(p.y>=477&&p.x>=705)) return "beach";
    if(p.x>=225&&p.x<=455&&p.y<=333) return "cottage";
    return "walk";
  }
  function sceneStatus() {
    nearestShell=shells.find(item=>!counts[item.id]&&Math.hypot(item.x-p.x,item.y-p.y)<35);
    const here=place();
    if(here!==visitedPlace) {
      visitedPlace=here; el("where").textContent=places[here];
      if(!fishing&&here==="dock") say("부두 끝으로 걸어가면 낚싯대를 던질 수 있어요.","","fish",3800);
      if(!fishing&&here==="beach") say("반짝이는 조개 가까이 가서 주워 보세요.","","shell",3800);
    }
    const mode=fishing?(fishing.state==="bite"?"bite":"wait"):nearestShell?"shell":
      p.x>=1037&&p.y>=385&&p.y<=466?"cast":here==="dock"?"go":
      here==="beach"?"sea":"talk";
    if(mode===currentAction) return;
    currentAction=mode;
    const actions={
      bite:["지금 당기기","fish"],wait:["낚싯대 거두기","fish"],
      shell:["조개 줍기","shell"],cast:["낚시하기","fish"],
      go:["부두 끝으로","pin"],sea:["바다 바라보기","wave"],talk:["함니와 얘기","talk"]
    };
    const [text,symbol]=actions[mode], button=el("act");
    button.querySelector("span").textContent=text;
    button.querySelector("use").setAttribute("href","#i-"+symbol);
    button.dataset.alert=String(mode==="bite");
  }
  function action() {
    if(el("journal").open) return;
    const now=performance.now();
    if(now<gate) return;
    gate=now+260;
    if(fishing) {
      if(fishing.state==="bite"&&now<=fishing.until) {
        const unrecorded=fish.filter(item=>!counts[item.id]);
        const pool=unrecorded.length?unrecorded:fish;
        const caught=pool[Math.floor(Math.random()*pool.length)];
        counts[caught.id]=(counts[caught.id]||0)+1;
        effects.push({x:p.x+28,y:p.y-45,until:now+1100,color:caught.color,fish:true});
        say("예쥬니 형, "+caught.name+" 잡았어요! 수첩에 적어 둘게요.","함니","fish",4700);
        chime(535,795); save();
      } else if(fishing.state==="waiting") {
        say("낚싯대를 거뒀어요. 다시 던질 수 있어요.","","fish",3000);
      } else {
        say("예쥬니 형, 한 번 더 던져 봐요. 아직 물고기 많아요.","함니","fish",4000);
      }
      fishing=null; companionRoute=[]; sceneStatus(); return;
    }
    sceneStatus();
    if(nearestShell) {
      counts[nearestShell.id]=1;
      effects.push({x:p.x+22,y:p.y-35,until:now+1100,color:nearestShell.color});
      say(nearestShell.name+"를 주웠어요. 수첩에 넣어 둘게요.","","shell",3500);
      chime(495,745); save();
    } else if(currentAction==="cast") {
      route=[]; clickMark=null; p.moving=false;
      fishing={state:"waiting",until:now+2100+Math.random()*1900,bobX:Math.max(p.x+73,1145),bobY:p.y-7};
      say("예쥬니 형, 찌가 물속으로 쏙 들어가면 바로 당겨요.","함니","fish",8500);
      chime(355);
    } else if(currentAction==="go") {
      route=findRoute(p,1071,422);
      say("부두 끝으로 걷고 있어요.","","pin",3000);
    } else if(currentAction==="sea") {
      sayTogether(["민아, 파도 소리 좋다. 조금만 더 있다 갈까?", "좋아요, 예쥬니 형. 저도 여기 더 있고 싶어요."],"wave");
      chime(440);
    } else {
      titleTime=now+2500;
      sayTogether(dialogue[dialogueIndex++%dialogue.length]);
    }
    sceneStatus();
  }

  function startSound() {
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio) return;
    const audio=new Audio(), buffer=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate);
    const samples=buffer.getChannelData(0);
    let prev=0;
    for(let i=0;i<samples.length;i++) {prev=(prev+Math.random()*.045-.0225)/1.025; samples[i]=prev*2.8;}
    const noise=audio.createBufferSource(), filter=audio.createBiquadFilter(), wave=audio.createGain(), master=audio.createGain();
    const tide=audio.createOscillator(), strength=audio.createGain();
    noise.buffer=buffer; noise.loop=true; filter.type="lowpass"; filter.frequency.value=560;
    wave.gain.value=.54; master.gain.value=.18; tide.frequency.value=.24; strength.gain.value=.29;
    noise.connect(filter).connect(wave).connect(master).connect(audio.destination);
    tide.connect(strength).connect(wave.gain); noise.start(); tide.start();
    sound={audio,master,enabled:false};
  }
  function chime(...frequencies) {
    if(!sound?.enabled) return;
    const {audio,master}=sound;
    frequencies.forEach((frequency,i)=>{
      const pitch=audio.createOscillator(), gain=audio.createGain(), time=audio.currentTime+i*.09;
      pitch.frequency.value=frequency; pitch.type="sine";
      gain.gain.setValueAtTime(.001,time);
      gain.gain.exponentialRampToValueAtTime(.28,time+.018);
      gain.gain.exponentialRampToValueAtTime(.001,time+.32);
      pitch.connect(gain).connect(master); pitch.start(time); pitch.stop(time+.34);
    });
  }
  el("sound").addEventListener("click",async()=>{
    if(!sound) startSound();
    if(!sound) return;
    sound.enabled=!sound.enabled;
    if(sound.enabled) await sound.audio.resume();
    else await sound.audio.suspend();
    const button=el("sound");
    button.setAttribute("aria-pressed",String(sound.enabled));
    button.setAttribute("aria-label",sound.enabled?"파도 소리 끄기":"파도 소리 켜기");
    button.querySelector("use").setAttribute("href",sound.enabled?"#i-volume":"#i-muted");
  });

  const directions={ArrowUp:"w",ArrowLeft:"a",ArrowDown:"s",ArrowRight:"d",KeyW:"w",KeyA:"a",KeyS:"s",KeyD:"d"};
  window.addEventListener("keydown",event=>{
    if(el("journal").open||event.altKey||event.ctrlKey||event.metaKey) return;
    if(directions[event.code]) {
      event.preventDefault();
      moveKeys.add(event.code);
      route=[]; clickMark=null;
    } else if(event.code==="Escape"&&fishing) {
      fishing=null; say("낚싯대를 거뒀어요.","","fish",2500); sceneStatus();
    } else if(event.code==="KeyE"||(event.code==="Space"&&!canMove(event.target))) {
      event.preventDefault();
      if(!event.repeat) action();
    }
  });
  window.addEventListener("keyup",event=>moveKeys.delete(event.code));
  window.addEventListener("blur",()=>{moveKeys.clear(); padKeys.clear();});
  canvas.addEventListener("pointerdown",event=>{
    if(fishing||event.button!==0) return;
    const rect=canvas.getBoundingClientRect();
    const x=(event.clientX-rect.left)/camera.scale+camera.x, y=(event.clientY-rect.top)/camera.scale+camera.y;
    route=findRoute(p,x,y);
    if(!route.length) return;
    const last=route[route.length-1];
    clickMark={...last,until:performance.now()+650};
  });
  document.querySelectorAll("[data-dir]").forEach(button=>{
    button.addEventListener("pointerdown",event=>{
      event.preventDefault(); button.setPointerCapture(event.pointerId);
      padKeys.set(event.pointerId,button.dataset.dir); route=[]; clickMark=null;
    });
    for(const type of ["pointerup","pointercancel","lostpointercapture"]) {
      button.addEventListener(type,event=>padKeys.delete(event.pointerId));
    }
    button.addEventListener("click",event=>{
      if(event.detail!==0||fishing) return;
      const dx={a:-1,d:1}[button.dataset.dir]||0, dy={w:-1,s:1}[button.dataset.dir]||0;
      walk(p,dx*22,dy*22,22);
    });
  });
  let pauseTime=0;
  el("act").addEventListener("click",action);
  el("journal-button").addEventListener("click",()=>{
    moveKeys.clear(); padKeys.clear(); pauseTime=performance.now(); el("journal").showModal();
  });
  el("journal").addEventListener("close",()=>{
    if(fishing) fishing.until+=performance.now()-pauseTime;
  });

  function loop(now) {
    const dt=Math.min(.038,(now-(lastTime||now))/1000);
    lastTime=now;
    if(!el("journal").open) {
      if(!fishing) {
        const active=new Set([...Array.from(moveKeys,key=>directions[key]),...padKeys.values()]);
        const dx=Number(active.has("d"))-Number(active.has("a")), dy=Number(active.has("s"))-Number(active.has("w"));
        if(dx||dy) walk(p,dx*140,dy*140,190*dt);
        else walkRoute(p,route,190*dt);
      } else if(now>=fishing.until) {
        if(fishing.state==="waiting") {
          fishing.state="bite"; fishing.until=now+1900;
          say("물었어요! 지금 당겨요.","","fish",1900,true); chime(440,710);
        } else {
          fishing=null; companionRoute=[];
          say("예쥬니 형, 한 번 더 던져 봐요. 아직 물고기 많아요.","함니","fish",4000);
        }
      }
      follow(dt,now);
      sceneStatus();
    }
    if(clickMark&&now>clickMark.until) clickMark=null;
    effects=effects.filter(effect=>now<effect.until);
    if(messageUntil&&now>messageUntil) el("message").hidden=true;
    if(now-redrawTime>16) { draw(now); redrawTime=now; }
    requestAnimationFrame(loop);
  }
  sayTogether(["민아, 오른쪽 부두까지 걸어갈까?", "좋아요, 예쥬니 형. 저도 같이 갈게요."]);
  requestAnimationFrame(loop);
  </script>
</body>
